# Local dev stack: one Postgres instance (two databases: airflow, watchdog)
# plus Airflow 3.x running LocalExecutor — no Celery, no Redis, no worker
# service, because a single small VM (the day-7 deploy target) doesn't need
# a distributed task queue for a nightly job that fans out to a handful of
# models. Airflow 3.x also split what used to be one "webserver" process
# into api-server + dag-processor as separate services; both are required.
#
# First run: docker compose up --build
# UI: http://localhost:8080  (user: airflow / password: airflow, dev only)

x-airflow-common:
  &airflow-common
  build: .
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # DAG files here change rarely (the task suite is versioned data, not
    # code) so parsing less often trades a bit of pickup latency for a lot
    # less CPU on a 4GB box — this is the "raised DAG parsing interval".
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "600"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "60"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/src/watchdog/dags
    PYTHONPATH: /opt/airflow/src
    # Overrides the WATCHDOG_DATABASE_URL from .env (env_file above) —
    # that value uses "localhost", correct for host tooling (Alembic,
    # seed.py) but meaningless inside a container. `environment:` takes
    # precedence over `env_file:` for the same key, so this wins here.
    WATCHDOG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/watchdog
    # /opt/airflow/src and /opt/airflow/.git are two separate bind
    # mounts — different filesystems from git's point of view — so
    # `git rev-parse HEAD` refuses to walk from one up into the other
    # without this. Harmless here; it only widens where git is willing
    # to look, not what it trusts.
    GIT_DISCOVERY_ACROSS_FILESYSTEM: "1"
    # The mounted .git is owned by the host user, not the container's
    # airflow user (uid 50000) — git's "dubious ownership" check (a
    # real security feature, for a real threat model that doesn't apply
    # to a read-only dev bind mount) would otherwise refuse to read it.
    # Set via env rather than a config file, so it survives container
    # recreation without needing to persist anything.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "safe.directory"
    GIT_CONFIG_VALUE_0: "*"
  volumes:
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    # Read-only, just so DAG code can resolve the current commit's SHA
    # for provenance (git_sha) — mounted so that walking up from
    # /opt/airflow/src/watchdog finds it two levels up, the same
    # relative position .git sits in on the host.
    - ./.git:/opt/airflow/.git:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    ports:
      # Published for local dev tooling (Alembic, seed.py, psql) running
      # on the host — bound to localhost only, not exposed beyond this
      # machine. The day-7 VM will not carry this over. Host side is 5433
      # because something else on this machine already owns 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./docker/postgres-initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        /entrypoint airflow db migrate
        /entrypoint airflow users create \
          --username airflow --password airflow \
          --firstname airflow --lastname airflow \
          --role Admin --email airflow@example.com || true
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
