[project]
name = "watchdog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AhmadTawil1", email = "ahmadtawil.se@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "apache-airflow>=3.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
watchdog = "watchdog:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
