repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # alembic/versions/*: revision IDs are random hex strings by
        # design (Alembic's own convention) and reliably false-positive
        # as "high entropy" secrets — excluded rather than pragma'd on
        # every migration file, since every future migration hits this.
        exclude: package.lock.json|uv.lock|alembic/versions/.*\.py
